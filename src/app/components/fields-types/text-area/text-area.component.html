<mat-form-field
  class="w-full"
  appearance="fill"
  subscriptSizing="dynamic"
  [floatLabel]="field().label ? 'always' : 'auto'"
  [hideRequiredMarker]="!field().required">
  <mat-label>{{ field().label }}</mat-label>
  <textarea
    [id]="'textarea-' + field().id"
    [placeholder]="field().placeholder || ''"
    [value]="value()"
    (input)="onInputChange($event)"
    rows="4"
    matInput
    [required]="field().required"
    [style.border]="getBorderStyle()"
    class="resize-y">
  </textarea>
</mat-form-field>
