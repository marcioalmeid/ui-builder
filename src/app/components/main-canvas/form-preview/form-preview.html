<div class="p-6">
    <div class="py-6 flex flex-col gap-4 shadow-md rounded-lg border bg-gray-0">
    @for (row of displayRows(); track row.id) {
         <div class="flex gap-4 flex-wrap ">
            @for (field of row.fields; track field.id) {
              @if (!interactive() || isVisible(field)) {
                <app-field-preview
                  [field]="field"
                  [interactive]="interactive()"
                  [value]="jobData()[field.id]"
                  (valueChange)="onFieldValueChange(field.id, $event)"
                  [class.flex-1]="field.type !== 'section-header' && field.type !== 'cost-breakdown'"
                  [class.basis-full]="field.type === 'section-header' || field.type === 'cost-breakdown'" />
              }
            }
         </div>
    }
    </div>
</div>
