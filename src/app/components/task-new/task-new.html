<div class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-5xl mx-auto">
    <div class="flex items-start justify-between mb-6 gap-4 flex-wrap">
      <div>
        <h1 class="text-2xl font-medium">New task</h1>
        <p class="text-sm text-gray-500 mt-1">
          Choose a published template to fill out and submit.
        </p>
      </div>
      <a mat-stroked-button routerLink="/tasks">
        <mat-icon>arrow_back</mat-icon> All tasks
      </a>
    </div>


    @if (filteredTemplates().length === 0) {
      <div class="bg-white border rounded-lg p-6 text-sm text-gray-600">
        No published templates yet.
      </div>
    } @else {
      <div class="flex flex-col gap-3">
        @for (template of filteredTemplates(); track template.id) {
          <article class="bg-white border rounded-lg p-4 shadow-sm">
            <div class="flex items-start justify-between gap-4 flex-wrap">
              <div class="min-w-0 flex-1">
                <h2 class="font-medium">{{ template.name }}</h2>
              </div>
              <div class="flex flex-wrap gap-2 shrink-0">
                <a mat-flat-button color="primary" [routerLink]="['/run', template.id]">
                  <mat-icon>play_arrow</mat-icon> Start
                </a>
              </div>
            </div>
          </article>
        }
      </div>
    }
  </div>
</div>
